<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>The Almanac – Cortex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <style>
        :root {
            --page-bg: #e3ddd6;
            --card-bg: #ddcec1;
            --accent: #2c2220;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 60px 20px 40px;
            background: var(--page-bg);
            font-family: Georgia, serif;
            color: var(--accent);
            text-align: center;
        }

        /* Title image */
        .title-image {
            width: 300px; /* adjust size as you wish */
            margin: 0 auto 40px;
            display: block;
        }

        /* App icon */
        .app-icon-wrapper {
            width: 100px;
            margin: 0 auto -50px;
        }

        .app-icon-img {
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 12px 18px rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(0, 0, 0, 0.05);
        }

        /* Promo text block */
        .promo-block {
            background: var(--card-bg);
            border-radius: 26px;
            padding: 70px 30px 50px;
            max-width: 480px;
            margin: 0 auto 48px;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .promo-block p {
            margin: 0 0 40px;
            font-size: 20px;
            line-height: 1.45;
        }

        /* App Store image button */
        .store-img {
            width: 160px;
            height: auto;
        }

        footer {
            margin-top: 40px;
            font-size: 14px;
        }

        footer .studio {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        footer a {
            color: var(--accent);
            text-decoration: underline;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .promo-block {
                padding: 60px 20px 40px;
            }

            .title-image {
                width: 240px;
            }

            .app-icon-wrapper {
                width: 80px;
            }

            .store-img {
                width: 140px;
            }
        }
    </style>
</head>

<body>

<!-- Title graphic -->
<img src="title.png" alt="The Almanac" class="title-image"/>

<!-- App Icon -->
<div class="app-icon-wrapper">
    <img src="appicon.png" alt="App Icon" class="app-icon-img"/>
</div>

<!-- Promo Block -->
<div class="promo-block">
    <p>Begin your journey into<br/>handcrafted puzzles</p>

    <a href="https://apps.apple.com/us/app/the-almanac/id6742649363">
        <img src="download.svg" alt="Download on the App Store" class="store-img"/>
    </a>
</div>

<footer>
    <div class="studio">Cortex</div>
    <a href="mailto:contact@cortexstudio.io">contact@cortexstudio.io</a>
</footer>

</body>
</html>
